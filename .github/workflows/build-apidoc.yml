name: Build Katello API docs

on:
  workflow_dispatch:

jobs:
  katello:
    uses: theforeman/actions/.github/workflows/foreman_plugin.yml@build-docs-again
    with:
      plugin: katello
      plugin_repository: Katello/katello
      plugin_version: KATELLO-5.0
      foreman_version: 5.0-stable
      test_existing_database: false
      test_core_tests: false
